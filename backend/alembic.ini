[alembic]
script_location = alembic
# 数据库连接：严禁在此填写真实密码（文件已纳入 git 版本控制）。
# env.py 会在值为占位符时自动改用 backend/.env 的 DATABASE_URL，
# 本地执行 alembic 迁移无需修改本行。
sqlalchemy.url = mysql+aiomysql://root:CHANGE_ME@localhost:3306/ai_tutor

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
